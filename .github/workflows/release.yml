name: Publicar MAAT One para Windows
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validar versión
        shell: pwsh
        run: |
          $version = (Get-Content version.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'El tag no coincide con version.json' }
      - name: Instalar dependencias de compilación
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Pruebas
        run: python -m unittest discover -s tests -q
      - name: Paquete de actualización compatible
        run: python tools/build_release.py
      - name: Instalador con Python incluido
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'No está disponible el compilador Inno Setup' }
          python tools/build_windows.py --iscc $iscc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publicar versión
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content version.json | ConvertFrom-Json).version
          $notes = "Descargue MAAT-One-$version-Windows.zip, extraiga el ZIP y ejecute el instalador. Incluye Python, dependencias y accesos directos con icono. Windows 10/11 x64. El ZIP sin Windows es para actualizar instalaciones anteriores desde Python."
          gh release create $env:GITHUB_REF_NAME "release_dist/MAAT-One-$version-Windows.zip" "release_dist/MAAT-One-$version-Windows.zip.sha256" "release_dist/MAAT-One-$version.zip" "release_dist/MAAT-One-$version.zip.sha256" --verify-tag --latest --title "MAAT One $version" --notes $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
